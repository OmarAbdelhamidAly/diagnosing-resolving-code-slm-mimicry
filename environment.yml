name: reo_env
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10.20
  - pip=23.2.1
  - pip:
      # PyTorch 2.6.0 with CUDA 12.4
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.6.0+cu124
      - torchvision==0.21.0+cu124
      - torchaudio==2.11.0
      # LLM, LoRA, and Quantization
      - transformers==4.51.3
      - peft==0.19.1
      - bitsandbytes==0.49.2
      - accelerate==1.7.0
      - trl==0.24.0
      - safetensors==0.7.0
      - huggingface-hub==0.36.2
      # Datasets & Configuration
      - datasets==3.6.0
      - pydantic==2.10.6
      - pyyaml==6.0.3
      - requests==2.33.1
      # Scientific & Evaluation
      - numpy==1.26.4
      - pandas==2.3.3
      - scipy==1.15.3
      - scikit-learn==1.7.2
      # Visualization
      - matplotlib==3.8.0
      - seaborn==0.13.0
      - tqdm==4.67.3
      - rich==15.0.0
      # Development & Notebooks
      - ipykernel==6.29.5
      - jupyterlab==4.6.0
      - pytest==9.1.1
