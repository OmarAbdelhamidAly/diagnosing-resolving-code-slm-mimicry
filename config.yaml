# =====================================================================
# Reduction Ladder for Code Reasoning & Multi-Arm Mitigation
# Configuration File — Single Source of Truth
# Orange Innovation Labs — AI Research Division
# =====================================================================

project:
  name: "diagnosing-resolving-code-slm-mimicry"
  authors: ["Omar Abdelhamid", "Nour Walid"]
  supervisor: "Dr. Ghada Soliman"
  institution: "Orange Innovation Labs"
  seed: 42

storage:
  # Drive path for Hugging Face weights cache (can be overridden by .env or HF_HOME)
  hf_cache_dir: "D:/hf_cache"
  ladder_cache_dir: "data/ladder"
  distillation_cache_dir: "data/distillation"
  results_dir: "results"
  checkpoints_dir: "checkpoints"

models:
  student_model: "Qwen/Qwen2.5-Coder-1.5B-Instruct"
  comparison_model: "Qwen/Qwen2.5-Coder-7B-Instruct"
  quantization: "4bit_nf4"
  max_seq_len: 2048
  device_map: "auto"
  torch_dtype: "bfloat16"

benchmarks:
  l0_humaneval: "openai/openai_humaneval"
  l1_subtle: "evoeval/EvoEval_subtle"
  l2_verbose: "evoeval/EvoEval_tool_use"
  l3_creative: "evoeval/EvoEval_creative"
  l4_difficult: "evoeval/EvoEval_difficult"
  l5_combine: "evoeval/EvoEval_combine"
  control_lcb: "livecodebench/code_generation_lite"

evaluation:
  pass_k: [1, 5]
  temperature_greedy: 0.0
  temperature_sample: 0.8
  num_samples: 5
  timeout_seconds: 8.0
  max_new_tokens: 512
  batch_size: 16

distillation:
  num_samples: 10000
  cot_source: "opencoder_reasoning"
  min_tokens: 64
  max_tokens: 1800
  vanilla_file: "sft_positive_cot.jsonl"
  contrastive_file: "sft_contrastive_pairs.jsonl"

# ── Mitigation Arms Hyperparameters ─────────────────────────────────

# M2: Vanilla SFT (CoT QLoRA)
qlora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  batch_size: 4
  gradient_accumulation_steps: 4
  epochs: 3
  warmup_ratio: 0.03
  vanilla_output_dir: "checkpoints/qlora_vanilla_adapter"
  contrastive_output_dir: "checkpoints/qlora_contrastive_adapter"

# M3: Contrastive SFT / DPO (Arm 2)
contrastive_dpo:
  beta: 0.1
  learning_rate: 5.0e-5
  lr_scheduler_type: "cosine"
  batch_size: 2
  gradient_accumulation_steps: 8
  epochs: 3
  warmup_ratio: 0.05
  output_dir: "checkpoints/qlora_contrastive_adapter"

# M4: Standard GRPO (Ablation Baseline)
standard_grpo:
  group_size: 4
  kl_coef: 0.05
  learning_rate: 1.0e-5
  training_steps: 500
  eval_every_steps: 50
  batch_size: 1
  sandbox_timeout: 3.0
  output_dir: "checkpoints/standard_grpo_final"

# M5: AST-Guided Policy Optimization (Arm 3)
ast_rl:
  group_size: 4
  kl_coef: 0.05
  learning_rate: 1.0e-5
  training_steps: 500
  eval_every_steps: 50
  batch_size: 1
  sandbox_timeout: 3.0
  sim_ast_weight: 0.4
  outcome_weight: 0.6
  output_dir: "checkpoints/rlvr_ast_final"

# M6: Invariance-Regularized GRPO (Arm 1 — Primary Contribution)
inv_grpo:
  group_size: 4
  kl_coef: 0.1
  lambda_consistency: 0.5
  gamma_template_penalty: 0.5
  training_steps: 1000
  eval_every_steps: 100
  batch_size: 1
  learning_rate: 1.0e-5
  output_dir: "checkpoints/inv_grpo_final"

# M7: Step-RLVR Process Reward (Arm 4)
step_rlvr:
  group_size: 4
  kl_coef: 0.05
  learning_rate: 1.0e-5
  training_steps: 500
  eval_every_steps: 50
  batch_size: 1
  sandbox_timeout: 3.0
  output_dir: "checkpoints/step_rlvr_final"
